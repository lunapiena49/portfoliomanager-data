version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Rome" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)", include: "scope" }
  - package-ecosystem: "npm"
    directory: "/site"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Rome" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)", include: "scope" }
