version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Rome" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)", include: "scope" }
  - package-ecosystem: "npm"
    directory: "/site"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Rome" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)", include: "scope" }
    ignore:
      # Types follow the lowest supported Node (engines >=22.12.0); majors only with a Node bump.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7: @astrojs/check 0.9.12 peers typescript ^5 || ^6 (npm ci ERESOLVE, S387).
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
